<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AhzkwidUGCSupport</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-light.min.css">
<style>
body{
  margin:0;
  background:#000000 url("https://ahzkwid.github.io/BoothSupport/assets/bg.png") center/cover no-repeat fixed;
}
.container{
  max-width:980px;
  margin:32px auto;
  padding:32px;
  background:#ffffff;
}
.lang{
  margin-top:32px;
  font-size:14px;
}
.lang button{
  background:none;
  border:none;
  color:#59636e;
  cursor:pointer;
  font:inherit;
  padding:2px 4px;
}
.lang button.active{
  color:#1f2328;
  font-weight:600;
  text-decoration:underline;
}
</style>
</head>
<body>
<main class="markdown-body container">
  <p data-i18n="desc"></p>
  <p><span data-i18n="inquiry"></span> : <a href="https://github.com/ahzkwid/AhzkwidUGCSupport/issues/new">https://github.com/ahzkwid/AhzkwidUGCSupport/issues/new</a></p>
  <p><span data-i18n="howto"></span> : <a href="https://github.com/ahzkwid/AhzkwidUGCSupport/issues/1">https://github.com/ahzkwid/AhzkwidUGCSupport/issues/1</a></p>
  <div class="lang">
    <button type="button" data-lang="en">English</button> |
    <button type="button" data-lang="ja">日本語</button>
  </div>
</main>
<script>
  const text = {
    en: {
      desc: "This is the support page for inquiries about Ahzkwid's creations.",
      inquiry: "Inquiry",
      howto: "How to write an inquiry"
    },
    ja: {
      desc: "このホームページはAhzkwidの制作物に関するお問い合わせ窓口です",
      inquiry: "お問い合わせ",
      howto: "お問い合わせの書き方"
    }
  };
  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.textContent = text[lang][el.dataset.i18n];
    });
    document.querySelectorAll(".lang button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
  }
  const first = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
  setLang(first.startsWith("ja") ? "ja" : "en");
  document.querySelectorAll(".lang button").forEach(b => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });
</script>
</body>
</html>
